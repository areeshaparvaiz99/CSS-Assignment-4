<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parallax Starter</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
html, body { width:100%; overflow-x:hidden; }
.header { height:55px; background:#000; color:#fff; display:flex; justify-content:space-between; align-items:center; padding:0 15px; position:fixed; top:0; left:0; width:100%; z-index:1000; }
.logo { font-size:13px; letter-spacing:3px; }
.menu { display:flex; gap:15px; }
.menu a { color:#fff; text-decoration:none; font-size:11px; letter-spacing:1px; }
#menu-check { display:none; position:absolute; left:-9999px; }
.hamburger { display:none; font-size:26px; cursor:pointer; }

.hero {
  width:100%; height:100vh;
  background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1497366811353-26cc3f5fa43d?w=1200') center/cover no-repeat;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; color:#fff; padding-top:55px;
}
.hero h1 { font-size:28px; font-weight:300; letter-spacing:4px; }
.hero p { font-size:10px; letter-spacing:2px; margin:15px 0; }
.btn { border:1px solid #fff; padding:8px 25px; color:#fff; text-decoration:none; font-size:11px; letter-spacing:2px; margin-top:10px; }

@media (max-width:768px){
  .header { position:static; flex-wrap:wrap; height:auto; min-height:55px; }
  .hamburger { display:block; }
  .menu { display:none; width:100%; flex-direction:column; background:#111; margin-top:10px; }
  .menu a { padding:12px 0; border-bottom:1px solid #222; display:block; }
  #menu-check:checked ~ .menu { display:flex; }
  .hero { padding-top:0; height:90vh; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">PARALLAX STARTER</div>
  <input type="checkbox" id="menu-check">
  <label for="menu-check" class="hamburger">☰</label>
  <div class="menu">
    <a href="#">HOME</a>
    <a href="#">ABOUT</a>
    <a href="#">SERVICES</a>
    <a href="#">GALLERY</a>
    <a href="#">CONTACT</a>
  </div>
</div>

<div class="hero">
  <h1>WELCOME TO OUR STUDIO</h1>
  <p>WE CREATE BEAUTIFUL DIGITAL EXPERIENCES</p>
  <a class="btn">EXPLORE</a>
</div>

</body>
</html>
